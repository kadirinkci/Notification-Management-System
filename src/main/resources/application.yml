spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:notification}
    password: ${RABBITMQ_PASSWORD:notification}

    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 4s
          stateless: true

app:
  mail:
    from: ${MAIL_FROM:no-reply@elsify.local}
  sms:
    provider: ${SMS_PROVIDER:mock}
    mock-transient-failures: ${SMS_MOCK_TRANSIENT_FAILURES:0}
  push:
    provider: ${PUSH_PROVIDER:mock}
  rate-limit:
    channels:
      EMAIL:
        capacity: ${RATE_LIMIT_EMAIL_CAPACITY:60}
        refill-tokens: ${RATE_LIMIT_EMAIL_REFILL_TOKENS:60}
        refill-period: ${RATE_LIMIT_EMAIL_REFILL_PERIOD:1m}
      SMS:
        capacity: ${RATE_LIMIT_SMS_CAPACITY:10}
        refill-tokens: ${RATE_LIMIT_SMS_REFILL_TOKENS:10}
        refill-period: ${RATE_LIMIT_SMS_REFILL_PERIOD:1m}
      PUSH:
        capacity: ${RATE_LIMIT_PUSH_CAPACITY:120}
        refill-tokens: ${RATE_LIMIT_PUSH_REFILL_TOKENS:120}
        refill-period: ${RATE_LIMIT_PUSH_REFILL_PERIOD:1m}
      LOG:
        capacity: ${RATE_LIMIT_LOG_CAPACITY:1000}
        refill-tokens: ${RATE_LIMIT_LOG_REFILL_TOKENS:1000}
        refill-period: ${RATE_LIMIT_LOG_REFILL_PERIOD:1m}

logging:
  level:
    org.flywaydb: INFO
